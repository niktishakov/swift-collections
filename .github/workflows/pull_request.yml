name: Pull request

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Fork test only: the Android emulator tests with every test runner
# (niktishakov/github-workflows@android-run-all-test-runners).
jobs:
  tests:
    name: Test
    uses: niktishakov/github-workflows/.github/workflows/swift_package_test.yml@fork-test-android
    with:
      enable_linux_checks: false
      enable_windows_checks: false
      enable_macos_checks: false
      enable_wasm_sdk_build: false
      enable_android_sdk_build: true
      enable_android_sdk_checks: true
